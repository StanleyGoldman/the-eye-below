<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Eye Below</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050404;
        color: #d8c9a3;
        font-family: monospace;
      }
      #nobuild {
        padding: 2em;
      }
    </style>
  </head>
  <body>
    <noscript><div id="nobuild">The Eye Below needs JavaScript.</div></noscript>
    <script src="dist/game.js"></script>
    <script>
      // If the bundle is missing, say how to make it instead of showing a blank page.
      if (!document.getElementById("app")) {
        var note = document.createElement("div");
        note.id = "nobuild";
        note.textContent = "The game has not been built yet. Run \"make build\" in this folder, then reload.";
        document.body.appendChild(note);
      }
    </script>
  </body>
</html>
